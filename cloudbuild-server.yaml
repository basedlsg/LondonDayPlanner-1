steps:
# Install dependencies
- name: 'gcr.io/cloud-builders/npm'
  args: ['install']
  # Build the server application
- name: 'gcr.io/cloud-builders/npm'
  args: ['run', 'build:server']
# Build the container image using the Dockerfile
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/london-day-planner-server', '-f', 'Dockerfile.server', '.']
# Push the container image to Google Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/london-day-planner-server']
# Deploy the container image to Google Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'london-day-planner-server'
  - '--image'
  - 'gcr.io/$PROJECT_ID/london-day-planner-server'
  - '--region'
  - 'us-central1'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
images:
- 'gcr.io/$PROJECT_ID/london-day-planner-server'